<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeNet – Social Media</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0f0f13; color: #ffffff; }
        .header { position: fixed; top: 0; left: 0; right: 0; background: rgba(15,15,19,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #27272a; padding: 0.75rem 2rem; z-index: 100; }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .search-bar { background: #1a1a2e; border-radius: 24px; padding: 0.5rem 1rem; display: flex; gap: 0.5rem; width: 300px; }
        .search-bar input { background: none; border: none; color: white; outline: none; width: 100%; }
        .header-icons { display: flex; gap: 1.5rem; }
        .header-icon { font-size: 1.25rem; cursor: pointer; color: #a1a1aa; }
        .container { max-width: 1200px; margin: 70px auto 0; display: grid; grid-template-columns: 1fr 320px; gap: 2rem; padding: 1rem 2rem; }
        .stories { display: flex; gap: 1rem; overflow-x: auto; padding: 1rem; background: #1a1a2e; border-radius: 16px; margin-bottom: 1.5rem; }
        .story-item { text-align: center; cursor: pointer; min-width: 70px; }
        .story-circle { width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #d62976, #962fbf); display: flex; align-items: center; justify-content: center; margin-bottom: 0.5rem; }
        .story-circle span { width: 60px; height: 60px; border-radius: 50%; background: #1a1a2e; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
        .story-name { font-size: 0.7rem; color: #a1a1aa; }
        .create-post { background: #1a1a2e; border-radius: 16px; padding: 1rem; margin-bottom: 1.5rem; }
        .create-post-header { display: flex; gap: 1rem; align-items: center; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .post-input { flex: 1; background: #0f0f13; border: 1px solid #27272a; border-radius: 24px; padding: 0.75rem 1rem; color: #a1a1aa; cursor: pointer; }
        .create-post-actions { display: flex; gap: 1rem; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid #27272a; }
        .action-icon { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.5rem; border-radius: 8px; cursor: pointer; color: #a1a1aa; }
        .post-card { background: #1a1a2e; border-radius: 16px; margin-bottom: 1rem; overflow: hidden; }
        .post-header { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; }
        .post-user { flex: 1; }
        .post-name { font-weight: 600; }
        .post-time { font-size: 0.7rem; color: #a1a1aa; }
        .post-image { width: 100%; max-height: 500px; object-fit: cover; }
        .post-content { padding: 0.75rem 1rem; line-height: 1.5; }
        .post-stats { padding: 0.5rem 1rem; display: flex; gap: 1rem; border-top: 1px solid #27272a; font-size: 0.85rem; color: #a1a1aa; }
        .post-stats span { cursor: pointer; }
        .post-buttons { display: flex; padding: 0.5rem 0; }
        .post-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.5rem; background: none; border: none; color: #a1a1aa; cursor: pointer; border-radius: 8px; }
        .post-btn:hover { background: #0f0f13; color: #6366f1; }
        .post-btn.liked { color: #ef4444; }
        .comments-section { padding: 0.5rem 1rem 1rem; border-top: 1px solid #27272a; }
        .comment { margin-bottom: 0.5rem; font-size: 0.85rem; }
        .comment strong { color: #6366f1; }
        .comment-input { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
        .comment-input input { flex: 1; background: #0f0f13; border: 1px solid #27272a; border-radius: 20px; padding: 0.5rem 1rem; color: white; outline: none; }
        .comment-input button { background: #6366f1; border: none; border-radius: 20px; padding: 0.5rem 1rem; color: white; cursor: pointer; }
        .sidebar { position: sticky; top: 90px; }
        .profile-card { background: #1a1a2e; border-radius: 16px; padding: 1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; }
        .profile-info { flex: 1; }
        .profile-name { font-weight: 600; }
        .trending-card, .suggestions-card { background: #1a1a2e; border-radius: 16px; padding: 1rem; margin-bottom: 1rem; }
        .trending-card h4, .suggestions-card h4 { margin-bottom: 1rem; font-size: 0.9rem; color: #a1a1aa; }
        .suggestion-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; cursor: pointer; }
        .follow-btn { background: #6366f1; border: none; padding: 0.3rem 0.8rem; border-radius: 8px; color: white; font-size: 0.75rem; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a2e; border-radius: 20px; max-width: 500px; width: 90%; }
        .modal-header { padding: 1rem 1.5rem; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; }
        .modal-body { padding: 1.5rem; }
        .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid #27272a; display: flex; justify-content: flex-end; gap: 1rem; }
        textarea { width: 100%; min-height: 120px; background: #0f0f13; border: 1px solid #27272a; border-radius: 12px; padding: 1rem; color: white; font-family: inherit; }
        input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; background: #0f0f13; border: 1px solid #27272a; border-radius: 8px; color: white; outline: none; }
        .btn-primary { background: #6366f1; border: none; padding: 0.5rem 1rem; border-radius: 8px; color: white; cursor: pointer; }
        .btn-secondary { background: #27272a; border: none; padding: 0.5rem 1rem; border-radius: 8px; color: white; cursor: pointer; }
        .auth-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .auth-tab { flex: 1; padding: 0.5rem; background: none; border: none; color: #a1a1aa; cursor: pointer; border-radius: 8px; }
        .auth-tab.active { background: #6366f1; color: white; }
        .story-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2000; display: none; align-items: center; justify-content: center; }
        .story-viewer img { max-width: 90%; max-height: 80vh; border-radius: 16px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1a1a2e; padding: 0.75rem 1.5rem; border-radius: 12px; z-index: 2000; animation: slideIn 0.3s ease; border-left: 4px solid #6366f1; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; padding: 1rem; } .sidebar { display: none; } .search-bar { display: none; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo"><i class="fab fa-users"></i>  VibeNet</div>
            <div class="search-bar"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search users..."></div>
            <div class="header-icons">
                <div class="header-icon" onclick="openDMs()"><i class="fas fa-paper-plane"></i></div>
                <div class="header-icon" onclick="openProfile()"><i class="fas fa-user"></i></div>
            </div>
        </div>
    </div>

    <div class="container" id="appContainer">
        <div class="feed">
            <div class="stories" id="storiesContainer"></div>
            <div class="create-post" id="createPostBox"></div>
            <div id="postsContainer"></div>
        </div>
        <div class="sidebar" id="sidebarContainer"></div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header"><h3>Welcome to VibeNet</h3><button onclick="closeLoginModal()">&times;</button></div>
            <div class="modal-body">
                <div class="auth-tabs"><button class="auth-tab active" id="loginTab" onclick="showLoginTab()">Login</button><button class="auth-tab" id="registerTab" onclick="showRegisterTab()">Register</button></div>
                <form id="loginForm"><input type="text" id="loginUsername" placeholder="Username"><input type="password" id="loginPassword" placeholder="Password"><button type="submit" class="btn-primary" style="width:100%;">Login</button></form>
                <form id="registerForm" style="display:none;"><input type="text" id="regUsername" placeholder="Username"><input type="email" id="regEmail" placeholder="Email"><input type="text" id="regFullName" placeholder="Full Name"><input type="password" id="regPassword" placeholder="Password"><button type="submit" class="btn-primary" style="width:100%;">Register</button></form>
            </div>
        </div>
    </div>

    <!-- Post Modal -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header"><h3>Create new post</h3><button onclick="closePostModal()">&times;</button></div>
            <div class="modal-body"><textarea id="postContent" placeholder="What's on your mind? 🔥" rows="3"></textarea><input type="file" id="postImage" accept="image/*" style="margin-top:10px;"><div id="imagePreview"></div></div>
            <div class="modal-footer"><button class="btn-secondary" onclick="closePostModal()">Cancel</button><button class="btn-primary" onclick="createPost()">Post</button></div>
        </div>
    </div>

    <!-- Story Viewer -->
    <div class="story-modal" id="storyViewer" onclick="closeStoryViewer()"><div class="story-viewer"><img id="storyImage" src=""></div></div>

    <!-- DM Modal -->
    <div class="modal" id="dmModal">
        <div class="modal-content" style="max-width:600px;height:500px;display:flex;flex-direction:column;">
            <div class="modal-header"><h3>Direct Messages</h3><button onclick="closeDMs()">&times;</button></div>
            <div style="display:flex;flex:1;overflow:hidden;">
                <div id="conversationsList" style="width:35%;border-right:1px solid #27272a;overflow-y:auto;padding:1rem;"></div>
                <div style="flex:1;display:flex;flex-direction:column;">
                    <div id="dmMessages" style="flex:1;overflow-y:auto;padding:1rem;"></div>
                    <div style="padding:1rem;border-top:1px solid #27272a;display:flex;gap:0.5rem;"><input type="text" id="dmMessage" placeholder="Type a message..." style="flex:1;"><button class="btn-primary" onclick="sendMessage()">Send</button></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
